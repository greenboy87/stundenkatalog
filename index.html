*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--page-bg) fixed;background-color:var(--bg);color:var(--text);min-height:100vh}
.icon{width:1.05em;height:1.05em;flex:0 0 auto;vertical-align:-.16em;margin-right:.45em}
.hint{color:var(--muted);font-size:.85rem;line-height:1.45}

/* Kopfzeile */
.topbar{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;background:var(--bar-bg);border-bottom:1px solid var(--card-border);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);padding:calc(.7rem + env(safe-area-inset-top,0px)) calc(1.2rem + env(safe-area-inset-right,0px)) .7rem calc(1.2rem + env(safe-area-inset-left,0px));position:sticky;top:0;z-index:20}

.main-tabs{display:flex;gap:.3rem;flex:1;flex-wrap:wrap}
.tab-btn{border:none;background:transparent;font:inherit;font-size:.95rem;font-weight:600;color:var(--muted);padding:.55rem .9rem;border-radius:var(--radius-sm);cursor:pointer;display:inline-flex;align-items:center}

button{font:inherit;font-size:.9rem;font-weight:600;border:1px solid var(--border);background:var(--input-bg);color:var(--text);border-radius:var(--radius-sm);padding:.5rem .9rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
button:hover{background:var(--hover)}
button.small,a.btn.small{font-size:.8rem;padding:.3rem .6rem}
a.btn{font-size:.85rem;font-weight:600;border:1px solid var(--border);background:var(--input-bg);color:var(--text);border-radius:var(--radius-sm);padding:.42rem .75rem;text-decoration:none;display:inline-flex;align-items:center}
a.btn:hover{background:var(--hover)}
a.btn.primary{background:var(--accent-grad);border-color:transparent;color:var(--on-accent)}
a.btn.primary:hover{filter:brightness(1.07)}
a.btn.ex{border-color:var(--accent);color:var(--accent-soft)}
#btn-theme{min-width:6.2rem;justify-content:flex-start}

input[type=search],select{font:inherit;padding:.55rem .8rem;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--input-bg);color:var(--text);width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{accent-color:var(--accent)}
select option{background:var(--card-solid);color:var(--text)}

.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);box-shadow:var(--shadow);padding:1.2rem}

.sek{margin-top:1.1rem}
.sek h3{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 .5rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{border:1px solid transparent;background:var(--panel);font-weight:600;color:var(--muted);padding:.35rem .65rem;border-radius:var(--radius-sm);cursor:pointer;font-size:.84rem;white-space:nowrap;display:inline-flex;align-items:center;gap:.4em;user-select:none}
.chip:hover{background:var(--hover);color:var(--text)}

.chip.zero{opacity:.38}
.klassen{display:grid;grid-template-columns:repeat(6,1fr);gap:.3rem}
.klassen .chip{justify-content:center;flex-direction:column;gap:0;padding:.4rem 0;font-size:1rem}

label.cb{display:flex;gap:.5rem;align-items:center;font-size:.88rem;margin:.35rem 0;cursor:pointer;color:var(--text)}

  $("count").innerHTML=`<b>${r.length}</b> von ${gesamt} ${S.samml?"Einträgen":"Stunden"}`;
  $("res").classList.toggle("list",S.liste);
  {const n=S.kl.size+S.th.size+S.mat.size;$("filterN").textContent=n?n+" aktiv":"einblenden";}
  $("grid").innerHTML=r.length?r.map(card).join(""):`<div class="empty card">Keine Stunde passt zu diesen Filtern.</div>`;
}
$("fehltSec").hidden=!D.fehlend.length;
$("fehlt").innerHTML=D.fehlend.map(f=>`<div class="card stunde"><h2>${esc(f.id)}</h2>${f.Notiz?`<div class="note">${esc(f.Notiz)}</div>`:""}<div class="meta">Ordner wurde umbenannt oder gelöscht – Eintrag in stunden.csv prüfen.</div></div>`).join("");
$("loseN").textContent=D.lose.length;
function loseRender(){$("lose").innerHTML=D.lose.map(l=>`<li><a href="${enc(l.pfad)}">${esc(l.name)}</a></li>`).join("")}
$("q").oninput=e=>{S.q=e.target.value;render()};
$("sort").onchange=e=>{S.sort=e.target.value;render()};
$("liste").onchange=e=>{S.liste=e.target.checked;render()};
$("samml").onchange=e=>{S.samml=e.target.checked;render()};
document.querySelectorAll("#fStatus .tab-btn").forEach(b=>b.onclick=()=>{S.status=b.dataset.v;render()});
$("reset").onclick=()=>{Object.assign(S,{q:"",kl:new Set(),th:new Set(),mat:new Set(),status:"alle"});render()};
document.addEventListener("click",ev=>{const a=ev.target.closest("a[data-ios]");
  if(a){ev.preventDefault();const t=a.dataset.ios,ziel=a.href;const zeig=m=>{const x=$("toast");x.textContent=m;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),4500)};
    /* Erst Zwischenablage, dann Sprung – sonst liest der Kurzbefehl den alten Inhalt */
    const los=()=>{zeig("Pfad kopiert – Kurzbefehl „Katalog öffnen iOS“ startet. Falls nicht: Kurzbefehl selbst antippen.");location.href=ziel};
    const alt=()=>{const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;opacity:0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();return ok};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(los,()=>alt()?los():zeig("Kopieren nicht möglich"));
    else alt()?los():zeig("Kopieren nicht möglich");
    return}
  const b=ev.target.closest("[data-copy]");if(!b)return;
  const t=b.dataset.copy;const ok=()=>{const x=$("toast");x.textContent=MODUS==="ios"?"Ordnername kopiert – in der Dateien-App in die Suche einfügen":IST_MAC?"Pfad kopiert – im Finder ⌘⇧G drücken und einfügen":IST_WIN?"Pfad kopiert – im Explorer in die Adressleiste einfügen":"Pfad kopiert";x.classList.add("show");setTimeout(()=>x.classList.remove("show"),3500)};
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>{});else{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();ok()}});
function modusUI(){if(MODUS==="ios"||D.online){$("fModus").hidden=true;$("modusHinweis").textContent=MODUS==="ios"?"Tippen kopiert den Dateipfad und startet den Kurzbefehl „Katalog öffnen iOS“. Startet er nicht von selbst, den Kurzbefehl einfach antippen (z. B. vom Home-Bildschirm). Dann: Drucken.":IST_MAC?"Öffnet über den Mac-Kurzbefehl „Katalog öffnen“.":"Auf diesem Gerät lassen sich Dateien nicht direkt öffnen. „Pfad“ kopiert den Speicherort.";return}document.querySelectorAll("#fModus button").forEach(b=>b.classList.toggle("on",b.dataset.v===MODUS));
  $("modusHinweis").textContent=MODUS==="kurzbefehl"?"Öffnet Ordner im Finder und Dateien direkt im Original – über den Kurzbefehl „Katalog öffnen“.":"Öffnet über den Browser. Ordner zeigen nur Chrome/Edge als Liste; Safari lädt Dateien evtl. als Kopie herunter.";}
document.querySelectorAll("#fModus button").forEach(b=>b.onclick=()=>{MODUS=b.dataset.v;try{localStorage.setItem("katalogModus",MODUS)}catch(e){};modusUI();loseRender();render()});
$("filterBtn").onclick=()=>document.querySelector("aside").classList.toggle("offen");
modusUI();loseRender();render();
</script>
</body>
</html>
